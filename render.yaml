services:
  - type: web
    name: binance-signal-engine-api
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TRADING_MODE
        value: paper
      - key: BROKER_ENABLED
        value: "false"
      - key: AUTO_TRADE
        value: "false"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: USE_TESTNET
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: RUN_WORKER
        value: "true"
      - key: DATABASE_URL
        value: "sqlite:////var/data/bot.db"
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /api/health
