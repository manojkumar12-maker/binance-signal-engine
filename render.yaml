services:
  - type: web
    name: binance-signal-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /health
