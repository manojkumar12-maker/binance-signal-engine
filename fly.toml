# fly.toml app configuration file generated for binance-signal-engine on 2026-11-19T15:33:43Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'binance-signal-engine'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTO_TRADE = 'false'
  BROKER_ENABLED = 'false'
  COOKIE_SECURE = 'true'
  DATABASE_URL = 'sqlite:////data/bot.db'
  LIVE_TRADING_ENABLED = 'false'
  PORT = '8080'
  RUN_WORKER = 'true'
  SCAN_TOP_N = '30'
  TRADING_MODE = 'paper'
  USE_TESTNET = 'true'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
