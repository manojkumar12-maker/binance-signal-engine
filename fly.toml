app = "binance-signal-engine"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = true

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services.tcp_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
