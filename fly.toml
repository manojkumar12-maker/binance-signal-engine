app = "binance-signal-engine"

kill_signal = "SIGTERM"
kill_timeout = "10s"

[env]
  DATABASE_URL = "sqlite:///data/trades.db"
  JSON_LOGGING = "true"
  PYTHONUNBUFFERED = "1"
  PORT = "8080"

[experimental]
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[mounts]]
  source = "trades_data"
  destination = "/app/data"
